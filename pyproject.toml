[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tradex"
version = "0.2.0"
description = "Level 4 Trading: strategy registry, cost-aware backtester and selection engine"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "PyYAML>=6.0",
  "TA-Lib>=0.6",
  "keyring>=24",
]

[project.optional-dependencies]
# Read-only dashboard (`tradex dashboard`). CI installs only `.[dev]` (the workflow file is a protected
# path), so `dev` carries the dashboard dependencies too; httpx is what FastAPI's test client needs.
dashboard = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=8", "fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27", "hypothesis>=6.100"]
moomoo = ["moomoo-api"]

[project.scripts]
tradex = "tradex.cli:main"
trade-x = "tradex.cli:main"

[tool.setuptools.packages.find]
include = ["tradex*"]

[tool.setuptools.package-data]
tradex = ["py.typed", "costs/*.csv", "dashboard/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
