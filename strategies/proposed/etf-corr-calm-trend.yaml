id: etf-corr-calm-trend
version: 1
asset_class: stocks
family: trend
hypothesis: Rising absorption (sector ETFs moving as one, Kritzman et al. 2011) precedes equity drawdowns. Hold ETF uptrends only while the absorption ratio is not rising against its one-year history.
universe: [SPY, QQQ, IWM, DIA, XLK, XLF, XLE, XLV, XLY, XLP, XLI, XLU, XLB]
timeframes: {signal: D1}
features:
  arz:    {fn: data.column, name: rg_absorb_z}
  ema100: {fn: talib.EMA, period: 100}
entry:
  long: "close > ema100 and arz < 1"
exit:
  stop_atr: 3.0
  target_r: 3.0
  max_bars: 40
  long_when: "arz > 1.5 or close < ema100"
holding: {expected_hours: 960}
sizing: {model: kelly_fraction, cap_risk_pct: 2}
search_space: {stop_atr: [2.0, 4.0], target_r: [2.0, 4.0], features.ema100.period: [50, 150]}
provenance: {source: "catalog: realised covariance regime detection (absorption ratio of the sector ETFs)", author: claude, created: 2026-10-04}
status: proposed
