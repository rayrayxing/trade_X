id: etf-pre-fomc-drift-h1
version: 1
asset_class: stocks
family: event_drift
hypothesis: US equity index returns concentrate in the 24 hours before scheduled FOMC announcements (Lucca and Moench 2015). Hold index ETFs from 24 hours before the statement to just before it.
universe: [SPY, QQQ, IWM, DIA]
timeframes: {signal: H1}
features:
  enter: {fn: data.column, name: evt_enter}
  leave: {fn: data.column, name: evt_leave}
entry:
  long: "enter > 0"
exit:
  stop_atr: 4.0
  target_r: 6.0
  max_bars: 16
  long_when: "leave > 0"
holding: {expected_hours: 24}
sizing: {model: kelly_fraction, cap_risk_pct: 1}
search_space: {stop_atr: [3.0, 6.0]}
provenance: {source: "catalog: pre-FOMC announcement drift (needs historical FOMC dates, see research/proposals.md)", author: claude, created: 2026-10-04, shares_trials_with: [etf-pre-fomc-drift-d1]}
status: proposed
