id: fx-carry-trend
version: 1
asset_class: forex
family: carry
hypothesis: High-yield currencies earn carry but crash in sudden unwinds. Take carry only in the highest-ranked pairs whose own 100-day trend agrees, which keeps the carry and avoids the pairs already turning.
universe: [EUR_USD, GBP_USD, USD_JPY, AUD_USD, USD_CAD, USD_CHF, NZD_USD, EUR_JPY, GBP_JPY]
timeframes: {signal: D1}
features:
  cry: {fn: data.column, name: carry}
  cxs: {fn: data.column, name: carry_xs}
  tsm: {fn: data.column, name: ts_mom}
entry:
  long:  "cxs >= 0.7 and cry > 0 and tsm > 0"
  short: "cxs <= 0.3 and cry < 0 and tsm < 0"
exit:
  stop_atr: 3.0
  target_r: 4.0
  max_bars: 40
  long_when: "cry <= 0 or tsm < 0"
  short_when: "cry >= 0 or tsm > 0"
holding: {expected_hours: 960, crosses_rollover: true}
sizing: {model: kelly_fraction, cap_risk_pct: 2}
search_space: {stop_atr: [2.0, 4.0], target_r: [3.0, 5.0]}
provenance: {source: "catalog: G10 carry (long high rate, short low rate) plus trend agreement; rates are injected (tradex.research.sources.RateSource)", author: claude, created: 2026-10-04}
status: proposed
