id: stk-rs-momentum-crash-protected
version: 1
asset_class: stocks
family: momentum
hypothesis: Stocks in the top fifth by relative-strength momentum against SPY (12 months, skipping the latest month) keep outperforming, except in the bear-market-plus-high-volatility state where momentum crashes (Daniel and Moskowitz 2016); stay out of it.
universe: [NVDA, AMD, TSLA, META, AMZN, AAPL, MSFT, KO, PEP, XOM, CVX, V, MA, JPM, BAC, GS, MS, HD, LOW, MRK, PFE, WMT, COST, INTC, CSCO, GOOGL, ORCL, UNH, JNJ]
timeframes: {signal: D1}
features:
  rsm:   {fn: data.column, name: rsm}
  rsx:   {fn: data.column, name: rsm_xs}
  crash: {fn: data.column, name: rg_crash}
entry:
  long: "rsx >= 0.8 and rsm > 0 and crash == 0"
exit:
  stop_atr: 3.0
  target_r: 4.0
  max_bars: 42
  long_when: "rsx < 0.5 or crash"
holding: {expected_hours: 1000}
sizing: {model: kelly_fraction, cap_risk_pct: 2}
search_space: {stop_atr: [2.0, 4.0], target_r: [3.0, 5.0]}
provenance: {source: "catalog: momentum with crash protection (relative-strength form, crash state from tradex.research.regime)", author: claude, created: 2026-10-04}
status: proposed
