id: stk-pead-ear
version: 1
asset_class: stocks
family: event_drift
hypothesis: Post-earnings-announcement drift predicted from the price reaction alone (the earnings announcement return, which carries most of the surprise information) continues for weeks after a large abnormal reaction; no EPS estimates are needed.
universe: [NVDA, AMD, TSLA, META, AMZN, AAPL, MSFT, KO, PEP, XOM, CVX, V, MA, JPM, BAC, GS, MS, HD, LOW, MRK, PFE, WMT, COST, INTC, CSCO, GOOGL, ORCL, UNH, JNJ]
timeframes: {signal: D1}
features:
  edz: {fn: data.column, name: ed_z}
  eda: {fn: data.column, name: ed_age}
  edp: {fn: data.column, name: ed_post}
entry:
  long:  "eda == 1 and edz > 1.5 and edp > 0"
  short: "eda == 1 and edz < -1.5 and edp < 0"
exit:
  stop_atr: 3.0
  target_r: 3.0
  max_bars: 40
holding: {expected_hours: 960}
sizing: {model: kelly_fraction, cap_risk_pct: 2}
search_space: {stop_atr: [2.0, 4.0], target_r: [2.0, 4.0]}
provenance: {source: "catalog: post-earnings announcement drift (price-reaction form, benchmark-adjusted; Bernard-Thomas 1989, Chan-Jegadeesh-Lakonishok 1996)", author: claude, created: 2026-10-04}
status: proposed
