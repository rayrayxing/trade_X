# Model gateway routes. Every agent category defaults to EasyCLIProxyAPI (route "proxy").
# To move a category to a direct key, change its `route` (e.g. anthropic). Fallbacks are
# tried in order when the primary errors or times out; a route whose secret is missing is skipped.
# Secrets (never in this file): proxy_base_url, proxy_api_key, anthropic_api_key, openai_api_key, google_api_key.
timeout_s: 20            # per attempt
total_budget_s: 45       # across all attempts of one call; then the call is skipped and logged

routes:
  proxy:     {kind: openai_compat, base_url_secret: proxy_base_url, key_secret: proxy_api_key}
  anthropic: {kind: anthropic, base_url: "https://api.anthropic.com", key_secret: anthropic_api_key}
  openai:    {kind: openai_compat, base_url: "https://api.openai.com/v1", key_secret: openai_api_key}
  google:    {kind: google, base_url: "https://generativelanguage.googleapis.com", key_secret: google_api_key}

# Add openai/google fallbacks with the model ids you want, e.g.
#   - {route: openai, model: <openai-model-id>}
#   - {route: google, model: <google-model-id>}
categories:
  scout_analyst:     {route: proxy, model: claude-sonnet-5-5, fallbacks: [{route: anthropic, model: claude-sonnet-5-5}]}
  position_reviewer: {route: proxy, model: claude-sonnet-5-5, fallbacks: [{route: anthropic, model: claude-sonnet-5-5}]}
  chart_reader:      {route: proxy, model: claude-sonnet-5-5, fallbacks: [{route: anthropic, model: claude-sonnet-5-5}]}
  researcher:        {route: proxy, model: claude-sonnet-5-5, fallbacks: [{route: anthropic, model: claude-sonnet-5-5}]}
  red_team:          {route: proxy, model: claude-opus-5-5,   fallbacks: [{route: anthropic, model: claude-opus-5-5}]}
  incident_analyst:  {route: proxy, model: claude-opus-5-5,   fallbacks: [{route: anthropic, model: claude-opus-5-5}]}
  strategy_designer: {route: proxy, model: claude-opus-5-5,   fallbacks: [{route: anthropic, model: claude-opus-5-5}]}
  critic:            {route: proxy, model: claude-opus-5-5,   fallbacks: [{route: anthropic, model: claude-opus-5-5}]}
