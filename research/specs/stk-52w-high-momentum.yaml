id: stk-52w-high-momentum
version: 1
asset_class: stocks
family: momentum
hypothesis: Stocks trading near their 52-week high, and nearer it than their peers, keep outperforming because investors anchor on the high (George and Hwang 2004). Time-boxed to the 30-day stock holding ceiling.
universe: [NVDA, AMD, TSLA, META, AMZN, AAPL, MSFT, KO, PEP, XOM, CVX, V, MA, JPM, BAC, GS, MS, HD, LOW, MRK, PFE, WMT, COST, INTC, CSCO, GOOGL, ORCL, UNH, JNJ]
timeframes: {signal: D1}
features:
  hr: {fn: data.column, name: hi_ratio}
  xs: {fn: data.column, name: hi_ratio_xs}
entry:
  long: "xs >= 0.8 and hr >= 0.95"
exit:
  stop_atr: 3.0
  target_r: 3.0
  max_bars: 20
  long_when: "xs < 0.5"
holding: {expected_hours: 480}
sizing: {model: kelly_fraction, cap_risk_pct: 2}
search_space: {stop_atr: [2.0, 4.0], target_r: [2.0, 4.0]}
provenance: {source: "catalog: 52-week-high momentum (George and Hwang 2004)", author: claude, created: 2026-10-04}
status: proposed
