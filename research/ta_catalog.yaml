# Technical analysis and candlestick catalog for trade_X
#
# Read by the strategy designer as its menu of ideas and its prior beliefs.
# Every entry describes a method in our own words from public descriptions;
# nothing is copied from the cited books. Sources are listed so a claim can be checked.
#
# Inheritance: an entry that leaves out weaknesses, evidence, stocks or forex
# takes the value from its family in `families`.
schema_version: 1
as_of: "2026-10-04"

grades:
  A: Replicated in peer-reviewed work across markets and periods, survives costs in at least some tests.
  B: Peer-reviewed support but mixed, market-specific, decaying since publication, or information without proven net profit.
  C: Practitioner statistics or published backtests only; plausible mechanism; no rigorous independent test we know of.
  D: No systematic evidence, not falsifiable as usually stated, or tested and found wanting.

code_status:
  now: Expressible today with the repo's registry (talib.* in TA-Lib 0.8.1, or an in-house pattern.*/stat.* function).
  small: Needs a new causal registry function on OHLCV bars only; a few dozen lines plus the look-ahead test.
  needs_data: Needs data the repo does not ingest yet (calendars, rates, breadth, VIX, positioning, tick data).
  approximate: Usually applied by eye; only a rule-based approximation can be coded, and it will differ from what practitioners mean.

# Checked 2026-10-04: every TA-Lib 0.8.1 function was recomputed on truncated data and
# matched the full-history values, so none looks ahead. FRACTAL marks the bar on which a
# fractal is confirmed, not the fractal bar itself. VWAP is cumulative from the first bar,
# not reset each session; a session VWAP needs its own function.

