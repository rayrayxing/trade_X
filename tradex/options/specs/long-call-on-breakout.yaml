id: opt-long-call-on-breakout
version: 1
asset_class: options
structure: long_call
underlying: {asset_class: stocks}
family: breakout
hypothesis: A close above the 50-day high on heavy volume carries for days; a 40-delta call 30-60 days out expresses it with the loss capped at the premium paid.
universe: [$watchlist, NVDA, AMD, TSLA, META, AMZN]
timeframes: {signal: D1}
features:
  hi50:   {fn: stat.highest, ref: high, period: 50}
  relvol: {fn: stat.rel_volume, period: 20}
  ema50:  {fn: talib.EMA, period: 50}
entry:
  long: "close > hi50 and relvol > 1.5 and close > ema50"
exit:
  stop_atr: 2.0          # on the underlying
  target_r: 3.0          # on the underlying, in multiples of the stop distance
  max_bars: 15
holding: {expected_hours: 240}
filters: [no_earnings_3d]
option:
  dte: {min: 30, max: 60}
  strike: {by: delta, target: 0.40, tolerance: 0.12}
  liquidity: {min_open_interest: 200, max_spread_pct: 0.12, min_bid: 0.20}
  exit: {close_dte: 10, premium_stop_pct: 0.5, premium_target_mult: 1.0}
sizing: {model: premium_at_risk, cap_risk_pct: 1.0}
search_space: {stop_atr: [1.5, 3.0], option.strike.target: [0.3, 0.6]}
provenance: {source: "breakout family, expressed with options", author: claude, created: 2026-10-04}
status: proposed
